spring.application.name=media-library

# Demo service: reachable from this machine only.
server.address=127.0.0.1
server.port=8083

# Runtime data lives outside source control (see README). Relative to the
# directory the backend is started from; the documented commands use backend/.
app.data-dir=./data
spring.datasource.url=jdbc:h2:file:${app.data-dir}/media-library
spring.datasource.username=sa
spring.datasource.password=

# Strict JSON types: releaseYear must be an integer or null, never "" or "1999".
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
